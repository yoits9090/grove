[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grove-db"
version = "0.1.0"
description = "A small persistent typed object-tree database"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GROVE contributors"}]

[project.scripts]
grove = "grove.cli:main"

[tool.setuptools.packages.find]
include = ["grove*"]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
